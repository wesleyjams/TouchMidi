; PlatformIO project configuration
; https://docs.platformio.org/page/projectconf.html

; "esp32dev" is the generic original ESP32 (WROOM-32) DevKit.
[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino

; Bluetooth MIDI library. Tiny API: begin(), isConnected(), noteOn(), noteOff().
lib_deps =
    max22/ESP32-BLE-MIDI@^0.4.0

; Bluetooth makes the program bigger than the default partition allows,
; so use a layout with more room for the app (we don't need OTA updates).
board_build.partitions = huge_app.csv

monitor_speed = 115200
